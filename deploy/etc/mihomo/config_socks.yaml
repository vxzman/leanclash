# ============================================================
# Mihomo SOCKS Mode Configuration
# Auto-generated from config_general.yaml + manager.yaml preset
# DO NOT EDIT DIRECTLY — edit config_general.yaml and run config sync
# ============================================================

allow-lan: true
bind-address: '*'
dns:
    default-nameserver:
        - 223.5.5.5
        - 119.29.29.29
    enable: true
    enhanced-mode: fake-ip
    fake-ip-filter:
        - '*.lan'
        - '*.local'
    fake-ip-range: 198.18.0.1/16
    ipv6: false
    listen: 0.0.0.0:1053
    nameserver:
        - https://dns.alidns.com/dns-query
        - https://doh.pub/dns-query
external-controller: 127.0.0.1:9090
find-process-mode: strict
global-client-fingerprint: chrome
ipv6: false
listeners:
    - listen: 0.0.0.0
      name: mixed-in
      port: 20260
      type: mixed
      udp: true
log-level: info
mode: rule
profile:
    store-fake-ip: true
    store-selected: true
proxies:
    - cipher: aes-256-gcm
      name: 示例节点-香港
      password: dev-fixture-only
      port: 8388
      server: 198.51.100.10
      type: ss
    - cipher: aes-256-gcm
      name: 示例节点-日本
      password: dev-fixture-only
      port: 8388
      server: 198.51.100.11
      type: ss
proxy-groups:
    - name: PROXY
      proxies:
        - 自动选择
        - 示例节点-香港
        - 示例节点-日本
        - DIRECT
      type: select
    - interval: 300
      name: 自动选择
      proxies:
        - 示例节点-香港
        - 示例节点-日本
      type: url-test
      url: http://www.gstatic.com/generate_204
rules:
    - GEOIP,lan,DIRECT,no-resolve
    - GEOIP,CN,DIRECT
    - MATCH,PROXY
sniffer:
    enable: true
    sniff:
        HTTP:
            ports:
                - 80
                - 8080-8880
        TLS:
            ports:
                - 443
                - 8443
tcp-concurrent: true
unified-delay: true
